name: Sync to Hugging Face
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Force Upload to Main
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          print('Starting heavy-duty upload via upload_large_folder...')
          
          # This method is specifically designed to prevent 502/504 timeouts
          api.upload_large_folder(
              folder_path='.',
              repo_id='VellaroSKIBIDI/NeuroAlz',
              repo_type='space',
              revision='main',
              token='${{ secrets.HF_TOKEN }}',
              ignore_patterns=['.github/*', '.git/*', '**/build/*', '**/dist/*', '**/*.exe', '**/*.pyc']
          )
          print('Mission Accomplished: Upload finished!')
          "

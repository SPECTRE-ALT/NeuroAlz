name: Sync to Hugging Face
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Upload to Step
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          api = HfApi()
          try:
              api.upload_folder(
                  folder_path='.',
                  repo_id='VellaroSKIBIDI/NeuroAlz',
                  repo_type='space',
                  token='${{ secrets.HF_TOKEN }}',
                  ignore_patterns=['.github/workflows/*', 'api/build/*', 'api/dist/*']
              )
          except Exception as e:
              print(f'Caught timeout but files might be there: {e}')
          "

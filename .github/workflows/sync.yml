name: Sync to Hugging Face
on:
  push:
    branches: [master] # This is your GitHub branch
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Push to HF Main
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os
          api = HfApi()
          print('Pushing files to the main branch...')
          api.upload_folder(
              folder_path='.',
              repo_id='VellaroSKIBIDI/NeuroAlz',
              repo_type='space',
              revision='main', # <--- This forces it to land on the branch you see
              token=os.environ['HF_TOKEN'],
              ignore_patterns=['.github/*', '.git/*', '**/build/*', '**/dist/*', '**/*.exe']
          )
          print('Done!')
          "
